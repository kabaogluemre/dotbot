name: issue-driven
version: "1.0"
description: >-
  GitHub issue → technical design → implementation → unit tests → PR.
  Runs directly inside the target repository. Each phase runs as a dotbot
  two-phase task (analysis + execution) on its own worktree forked from a
  shared feature branch and squash-merged back into it. When all phases
  complete, a PR is opened from the feature branch to main.
icon: code
min_dotbot_version: "4.0"

# ── Feature-branch mode ────────────────────────────────────────────────────
# When true, the framework auto-generates ONE feature branch (off main) for the
# whole run. Every task gets its own worktree forked FROM that feature branch
# and squash-merges back INTO it on completion. The final "Open PR" task opens a
# PR from the feature branch to main. The branch name is generated by dotbot
# (feature/issue-{N} when an issue number is resolvable from the launch prompt),
# so no template is needed here.
shared_feature_branch: true

# Branch the run's feature branch forks FROM (default: repo main/master).
# Set to "current" so it forks from whatever branch the project is checked out
# on at launch. Required here because the dotbot setup (.bot/ + the dotbot entry
# in .mcp.json) lives on a dedicated branch, not main — per-task worktrees only
# carry what is committed on the base, so forking from main would produce
# worktrees with no .bot/ (no MCP server, framework engine missing).
feature_branch_base: current

# ── Requires ─────────────────────────────────────────────────────────────────

requires:
  env_vars:
    - var: GITHUB_TOKEN
      name: "GitHub Personal Access Token"
      message: "GITHUB_TOKEN is required for the GitHub MCP server"
      hint: "Create at https://github.com/settings/tokens — needs 'repo', 'read:org', 'read:user' scopes. Set in your shell or .env.local"
  mcp_servers:
    - name: dotbot
      message: "Dotbot MCP server is required for task and session management"
      hint: "Run 'dotbot init --force' to re-register the dotbot server"
    - name: github
      message: "GitHub MCP server is required to read issues and open PRs"
      hint: "Add the GitHub MCP server to your Claude Code MCP config"
  cli_tools:
    - name: git
      message: "git CLI is required for branch management"
    - name: gh
      message: "GitHub CLI is required for PR creation"
      hint: "Install from https://cli.github.com/ and run 'gh auth login'"

# ── MCP Servers (auto-merged into .mcp.json on 'dotbot workflow add') ─────────

mcp_servers:
  github:
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

# ── Form (UI input) ───────────────────────────────────────────────────────────

form:
  modes:
    - id: run_issue
      label: "Run Issue Pipeline"
      description: "Design, implement, and unit-test a GitHub issue end-to-end on a shared feature branch, then open a PR."
      button: "RUN ISSUE"
      prompt_placeholder: "GitHub issue URL or 'owner/repo 42'"
      show_interview: false
      show_files: false

  fields:
    - name: issue_number
      type: number
      label: "Issue Number"
      required: true
      placeholder: "42"

# ── Task pipeline ─────────────────────────────────────────────────────────────
#
# Dependency chain (runs directly inside the target repo — no clone step):
#   Design Issue          (writes the technical design doc)
#     └─ Implement Issue   (reads the design, writes production code)
#          └─ Unit Tests    (adds tests on top)
#               └─ Open PR    (opens the PR for the feature branch — last)
#
# Each task forks its own worktree from the shared feature branch and the
# framework squash-merges it back after the task completes. The Open PR script
# task runs last and opens the PR from the feature branch to main.
#
# Analysis phase: 98-analyse-task.md + applicable_agents persona
# Execution phase: the numbered prompt in recipes/prompts/
# ─────────────────────────────────────────────────────────────────────────────

tasks:
  # ── Phase 1: Design Issue ─────────────────────────────────────────────────
  # Reads the issue + codebase, writes a technical design document to
  # docs/designs/issue-{n}-{slug}/design.md, and transitions labels.
  - name: "Design Issue"
    type: prompt
    workflow: "10-design-issue.md"
    applicable_agents: ["design-issue-agent"]
    priority: 1

  # ── Phase 2: Implementation ───────────────────────────────────────────────
  # Reads the design doc produced by Design Issue and writes production code.
  # Does NOT open a PR — the framework merges the worktree into the feature
  # branch and the dedicated Open PR task creates the PR.
  - name: "Implement Issue"
    type: prompt
    workflow: "12-implement-issue.md"
    applicable_agents: ["implement-issue-agent"]
    depends_on: ["Design Issue"]
    priority: 2

  # ── Phase 3: Unit Tests ───────────────────────────────────────────────────
  # Reads what Implement Issue wrote, produces a gap analysis as an issue
  # comment, and writes unit tests.
  - name: "Unit Tests"
    type: prompt
    workflow: "14-unit-test-pr.md"
    applicable_agents: ["unit-test-pr-agent"]
    depends_on: ["Implement Issue"]
    priority: 3

  # ── Phase 4: Open PR ──────────────────────────────────────────────────────
  # Script task: runs open-pr.ps1 which pushes the feature branch and calls
  # `gh pr create` from feature → main. Runs LAST.
  - name: "Open PR"
    type: script
    script_path: "scripts/open-pr.ps1"
    depends_on: ["Unit Tests"]
    priority: 4
